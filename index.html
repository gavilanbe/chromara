<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CHROMARA — PoC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0912;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0912}
  #hint{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:#6a6480;font:11px monospace;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="hint">Flechas/WASD mover · Z/Enter confirmar · X/Esc atrás · Enter en el mapa: menú · M sonido · F1 debug</div>
<script>
// The hosted game loads small manifests, then the cue it needs. The offline
// edition embeds identical Opus bytes so double-clicking index.html still works.
(function () {
  const scripts = ['data.js', 'music.js', 'music_cues.js', 'music_fallback.js'];
  if (location.protocol === 'file:') scripts.push('music_samples.js');
  scripts.push('sfx_samples.js', 'sfx.js', 'audio.js', 'sprites.js', 'scene.js', 'gui.js', 'battle.js', 'attacks.js', 'game.js');
  const version = location.protocol === 'file:' ? Date.now() : 'audio5';
  for (const src of scripts) document.write('<script src="' + src + '?v=' + version + '"><\/script>');
})();
</script>
</body>
</html>
