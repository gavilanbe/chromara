<style>
  /* The notebook's own letters, exported from font.js by tools/build_font.py: 16px is native size, 32px exactly double. */
  @font-face{font-family:'Chromara Cuaderno';src:url('chromara-cuaderno.ttf') format('truetype');font-display:block}
  @font-face{font-family:'Chromara Rotulo';src:url('chromara-rotulo.ttf') format('truetype');font-display:block}
  html,body{margin:0;height:100%;background:#0b0912;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0912}
  #hint{position:fixed;bottom:4px;left:0;right:0;text-align:center;color:#8a8298;font:16px/1 'Chromara Cuaderno',monospace;-webkit-font-smoothing:none;pointer-events:none}
</style>
<link rel="stylesheet" href="mobile.css?v=8ab51533c788">
</head>
<body>
<main id="game-shell" aria-label="Chromara">
  <nav id="touch-toolbar" class="touch-only" aria-label="Menús del juego">
    <button type="button" data-touch-menu="equipment" data-icon="equipment"><span>Equipo</span></button>
    <button type="button" data-touch-action="ring" data-icon="ring"><span>Magias</span></button>
    <button type="button" data-touch-action="journal" data-icon="journal"><span>Estudios</span></button>
    <button type="button" data-touch-action="help" data-icon="help"><span>Ayuda</span></button>
    <button type="button" data-touch-action="options" data-icon="options"><span>Opciones</span></button>
    <button type="button" id="touch-sound" data-icon="sound" aria-label="Silenciar sonido" aria-pressed="false"><span>Sonido</span></button>
    <button type="button" id="touch-fullscreen" data-icon="fullscreen" aria-label="Pantalla completa"></button>
  </nav>
  <div id="touch-movement" class="touch-only">
    <div id="touch-pad" aria-label="Cruceta: toca o desliza para moverte">
      <button type="button" data-touch-direction="up" aria-label="Arriba"><i></i></button>
      <button type="button" data-touch-direction="left" aria-label="Izquierda"><i></i></button>
      <span aria-hidden="true" class="pad-center"><span class="pad-nub"></span></span>
      <button type="button" data-touch-direction="right" aria-label="Derecha"><i></i></button>
      <button type="button" data-touch-direction="down" aria-label="Abajo"><i></i></button>
    </div>
    <span class="touch-caption" id="touch-caption">Toca o desliza</span>
  </div>
  <div id="game-screen"><div id="page"><canvas id="c" width="320" height="180"></canvas></div></div>
  <div id="touch-actions" class="touch-only" aria-label="Acciones del juego">
    <button type="button" data-touch-action="ok" id="touch-confirm"><b>A</b><span>Confirmar</span></button>
    <button type="button" data-touch-action="back" id="touch-back"><b>B</b><span>Volver</span></button>
    <button type="button" data-touch-action="swap"><b>Y</b><span>Gota</span></button>
    <button type="button" data-touch-action="release"><b>X</b><span>Liberar</span></button>
  </div>
</main>
<div id="rotate-device" class="touch-only" role="status">
  <span class="rotate-icon" aria-hidden="true">▯ ↻ ▭</span>
  <strong>Gira el móvil</strong>
  <p>Chromara se juega en horizontal.</p>
  <small>Tu partida queda pausada mientras giras la pantalla.</small>
</div>
<div id="hint" hidden>Flechas/WASD mover · Z/Enter confirmar · X/Esc atrás · Enter en el mapa: menú · M sonido · F1 debug</div>
<script>
// The hosted game loads small manifests, then the cue it needs. The offline
// edition embeds identical Opus bytes so double-clicking index.html still works.
(function () {
  const scripts = ['data.js', 'music.js', 'music_cues.js', 'music_fallback.js'];
  if (location.protocol === 'file:') scripts.push('music_samples.js');
  scripts.push('sfx_samples.js', 'sfx.js', 'audio.js', 'font.js', 'sprites.js', 'character_sprites.js', 'world_art.js', 'rinse.js', 'field.js', 'scene.js', 'gui.js', 'battle.js', 'ink_transition.js', 'attacks.js', 'combat.js', 'battle_ui.js', 'settings.js', 'mobile.js', 'chapter_art.js', 'chapters.js', 'prologue.js', 'game.js', 'pwa.js');
  if (new URLSearchParams(location.search).has('spriteLab')) scripts.push('tools/sprite_lab.js');
  if (new URLSearchParams(location.search).has('escena')) scripts.push('tools/escenas.js'); // development captures only
  const version = location.protocol === 'file:' ? Date.now() : '8ab51533c788';
  window.CHROMARA_VERSION = String(version); // stamped by tools/build_pwa.cjs: the same hash names the offline cache
  for (const src of scripts) document.write('<script src="' + src + '?v=' + version + '"><\/script>');
  // Installing, offline play and updates live in pwa.js.
})();
</script>
</body>
